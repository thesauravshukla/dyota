<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Karla:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; background: oklch(0.962 0.006 85); font-family: Karla, "Helvetica Neue", sans-serif; }
    a { color: #2A2622; } a:hover { opacity: 0.75; }
    .stage { width: 470px; box-sizing: border-box; padding: 30px 40px 38px; display: flex; flex-direction: column; gap: 18px; }
    .caption { display: flex; flex-direction: column; gap: 7px; }
    .caption h2 { margin: 0; font-family: "Instrument Serif", Georgia, serif; font-size: 28px; font-weight: 400; color: oklch(0.24 0.012 60); letter-spacing: -0.01em; }
    .caption p { margin: 0; font-size: 13px; line-height: 1.55; color: oklch(0.50 0.012 60); text-wrap: pretty; }

    .phone { width: 390px; height: 800px; background: oklch(0.975 0.007 85); border-radius: 40px; border: 1px solid oklch(0.86 0.008 75);
      box-shadow: 0 22px 54px -20px oklch(0.4 0.03 60 / 0.30); overflow: hidden; display: flex; flex-direction: column;
      color: oklch(0.21 0.010 60); position: relative; }
    .appbar { height: 58px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; border-bottom: 1px solid oklch(0.905 0.008 78); }
    .wordmark { font-family: "Instrument Serif", Georgia, serif; font-size: 23px; letter-spacing: 0.14em; }
    .appbar-actions { display: flex; gap: 16px; color: oklch(0.53 0.010 60); }
    .home { flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 20px; padding: 16px 18px 0; }

    .strip { display: flex; align-items: center; gap: 11px; background: oklch(0.945 0.010 82); border: 1px solid oklch(0.905 0.008 78);
      border-radius: 14px; padding: 12px 12px 12px 14px; min-height: 48px; box-sizing: border-box; }
    .strip-icon { display: flex; color: oklch(0.21 0.010 60); flex-shrink: 0; }
    .strip-text { flex: 1; font-size: 13.5px; line-height: 1.4; color: oklch(0.21 0.010 60); }
    .strip-x { width: 30px; height: 30px; border: 0; background: transparent; color: oklch(0.53 0.010 60); cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    .banner { background: oklch(0.997 0.004 85); border: 1px solid oklch(0.905 0.008 78); border-radius: 20px; padding: 20px 18px;
      display: flex; flex-direction: column; gap: 12px; position: relative; }
    .eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #2A2622; }
    .banner h3 { margin: 0; font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 27px;
      line-height: 1.15; letter-spacing: -0.01em; }
    .banner p { margin: 0; font-size: 13.5px; line-height: 1.5; color: oklch(0.53 0.010 60); text-wrap: pretty; max-width: 280px; }
    .dismiss { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border-radius: 50%; border: 0;
      background: transparent; color: oklch(0.53 0.010 60); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .field { height: 48px; border-radius: 12px; border: 1px solid oklch(0.905 0.008 78); background: oklch(0.975 0.007 85);
      display: flex; align-items: center; padding: 0 14px; font-size: 14.5px; color: oklch(0.72 0.010 78); }
    .row { display: flex; gap: 8px; align-items: center; }
    .progress { height: 3px; border-radius: 2px; background: oklch(0.935 0.012 80); overflow: hidden; }
    .progress span { display: block; width: 50%; height: 100%; background: #2A2622; }

    .scrim { position: absolute; inset: 0; background: oklch(0.21 0.010 60 / 0.42); }
    .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: oklch(0.997 0.004 85); border-radius: 26px 26px 40px 40px;
      padding: 12px 22px 26px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -8px 30px oklch(0.2 0.01 60 / 0.16); }
    .grab { width: 38px; height: 4px; border-radius: 2px; background: oklch(0.935 0.012 80); align-self: center; margin-bottom: 8px; }
    .sheet h3 { margin: 0; font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 30px; line-height: 1.1; }
    .sheet p { margin: 0; font-size: 14px; line-height: 1.55; color: oklch(0.53 0.010 60); text-wrap: pretty; }

    .sec { display: flex; flex-direction: column; gap: 12px; }
    .sec-title { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: oklch(0.53 0.010 60); }
    .cats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .cat { display: flex; flex-direction: column; align-items: center; gap: 7px; }
    .cat span { font-size: 11.5px; color: oklch(0.53 0.010 60); }
    .swatch { width: 100%; aspect-ratio: 1; border-radius: 14px; background: oklch(0.935 0.012 80); border: 1px solid oklch(0.905 0.008 78); }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .tile { border-radius: 16px; background: oklch(0.935 0.012 80); border: 1px solid oklch(0.905 0.008 78); height: 150px;
      display: flex; align-items: center; justify-content: center; color: oklch(0.72 0.010 78); }

    .btn { border: 0; border-radius: 999px; font-family: Karla, sans-serif; font-size: 15px; font-weight: 600;
      min-height: 50px; padding: 0 24px; cursor: pointer; background: #2A2622; color: oklch(0.985 0.004 85); }
    .btn-sm { min-height: 44px; font-size: 14px; align-self: flex-start; padding: 0 22px; }
    .btn-ghost { background: transparent; border: 0; color: oklch(0.53 0.010 60); font-family: Karla, sans-serif; font-size: 14px;
      font-weight: 500; min-height: 44px; padding: 0 14px; cursor: pointer; }
    .centred { align-self: center; }
    .ph { font-style: italic; color: oklch(0.72 0.010 78); border-bottom: 1px dashed oklch(0.905 0.008 78); padding-bottom: 2px; }
  </style>
</helmet>
<div class="stage">
  <div class="caption">
    <h2>Bottom sheet</h2>
    <p>Prefer for a deliberate first-run moment. Highest attention, highest friction, and the only one people cannot scroll past.</p>
  </div>
  <div class="phone">
    <div class="appbar">
      <span class="wordmark">DYOTA</span>
      <span class="appbar-actions"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7z"></path><path d="M9 7V5.5a3 3 0 0 1 6 0V7"></path></svg></span>
    </div>
    <div class="home">
      
      <div class="sec">
        <p class="sec-title">Shop by fibre</p>
        <div class="cats">
          <div class="cat"><div class="swatch"></div><span>Cotton</span></div>
          <div class="cat"><div class="swatch"></div><span>Silk</span></div>
          <div class="cat"><div class="swatch"></div><span>Linen</span></div>
          <div class="cat"><div class="swatch"></div><span>Khadi</span></div>
        </div>
      </div>
      <div class="sec">
        <p class="sec-title">New this week</p>
        <div class="grid">
          <div class="tile"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"></rect><path d="M3 15.5l4.5-4a2 2 0 0 1 2.7 0L16 17"></path><circle cx="15.5" cy="9" r="1.6"></circle></svg></div>
          <div class="tile"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"></rect><path d="M3 15.5l4.5-4a2 2 0 0 1 2.7 0L16 17"></path><circle cx="15.5" cy="9" r="1.6"></circle></svg></div>
        </div>
      </div>
    </div>
    <div class="scrim"></div>
        <div class="sheet">
          <div class="grab"></div>
          <h3>You're in.</h3>
          <p class="ph">[ two lines on what Dyota is and why an account matters ]</p>
          <button class="btn">Start browsing</button>
          <button class="btn-ghost centred">Maybe later</button>
        </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
