<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Karla:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; background: oklch(0.962 0.006 85); font-family: Karla, "Helvetica Neue", sans-serif; color: oklch(0.21 0.010 60); }
    a { color: oklch(0.21 0.010 60); } a:hover { opacity: 0.7; }
    .stage { width: 480px; box-sizing: border-box; padding: 30px 36px 36px; display: flex; flex-direction: column; gap: 22px; }
    .caption { display: flex; flex-direction: column; gap: 7px; }
    .caption h2 { margin: 0; font-family: "Instrument Serif", Georgia, serif; font-size: 28px; font-weight: 400; letter-spacing: -0.01em; }
    .caption p { margin: 0; font-size: 13px; line-height: 1.55; color: oklch(0.53 0.010 60); text-wrap: pretty; }
    .caption .risk { color: oklch(0.72 0.010 78); font-size: 12.5px; }
    .panel { background: oklch(0.997 0.004 85); border: 1px solid oklch(0.905 0.008 78); border-radius: 20px; padding: 26px; display: flex; flex-direction: column; gap: 22px; }
    .row-label { margin: 0; font-size: 10.5px; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase; color: oklch(0.72 0.010 78); }
    .hero { display: flex; align-items: center; justify-content: center; padding: 14px 0 6px; color: oklch(0.21 0.010 60); }
    .mono { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; display: block; }
    .lockup { display: flex; align-items: center; gap: 14px; justify-content: center; color: oklch(0.21 0.010 60); }
    .lockup .word { font-family: "Instrument Serif", Georgia, serif; font-size: 34px; letter-spacing: 0.16em; }
    .rule { height: 1px; background: oklch(0.905 0.008 78); }
    .icons { display: flex; align-items: flex-end; gap: 16px; }
    .ico { border-radius: 22.5%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .ico.light { background: oklch(0.975 0.007 85); border: 1px solid oklch(0.905 0.008 78); color: oklch(0.21 0.010 60); }
    .ico.dark { background: oklch(0.21 0.010 60); color: oklch(0.975 0.007 85); }
    .sizes { display: flex; gap: 16px; margin: 0; }
    .sizes span { font-size: 10.5px; color: oklch(0.72 0.010 78); text-align: center; }
    .stack { display: flex; flex-direction: column; gap: 10px; }
    .splash { width: 200px; height: 400px; border-radius: 26px; background: oklch(0.975 0.007 85); border: 1px solid oklch(0.905 0.008 78);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: oklch(0.21 0.010 60); }
    .splash .word { font-family: "Instrument Serif", Georgia, serif; font-size: 22px; letter-spacing: 0.18em; }
    .side { display: flex; gap: 22px; align-items: center; }
    .side .stack { flex: 1; }
  </style>
</helmet>
<div class="stage">
  <div class="caption">
    <h2>Monogram</h2>
    <p>No symbol at all — the serif D is the mark, cropped into the icon. Cheapest to execute well and ages slowly.</p>
    <p class="risk">Risk: carries no meaning on its own, so it leans entirely on the wordmark being seen.</p>
  </div>

  <div class="panel">
    <div class="hero"><span class="mono" style="font-size: calc(144 * 0.72px); line-height: 1;">D</span></div>

    <div class="rule"></div>

    <div class="stack">
      <p class="row-label">Lockup</p>
      <div class="lockup"><span class="mono" style="font-size: calc(40 * 0.72px); line-height: 1;">D</span><span class="word">DYOTA</span></div>
    </div>

    <div class="rule"></div>

    <div class="stack">
      <p class="row-label">App icon</p>
      <div class="icons">
        <div class="ico light" style="width: 88px; height: 88px;"><span class="mono" style="font-size: calc(52 * 0.72px); line-height: 1;">D</span></div>
        <div class="ico light" style="width: 60px; height: 60px;"><span class="mono" style="font-size: calc(36 * 0.72px); line-height: 1;">D</span></div>
        <div class="ico light" style="width: 44px; height: 44px;"><span class="mono" style="font-size: calc(26 * 0.72px); line-height: 1;">D</span></div>
        <div class="ico light" style="width: 29px; height: 29px;"><span class="mono" style="font-size: calc(18 * 0.72px); line-height: 1;">D</span></div>
      </div>
      <div class="icons">
        <div class="ico dark" style="width: 88px; height: 88px;"><span class="mono" style="font-size: calc(52 * 0.72px); line-height: 1;">D</span></div>
        <div class="ico dark" style="width: 60px; height: 60px;"><span class="mono" style="font-size: calc(36 * 0.72px); line-height: 1;">D</span></div>
        <div class="ico dark" style="width: 44px; height: 44px;"><span class="mono" style="font-size: calc(26 * 0.72px); line-height: 1;">D</span></div>
        <div class="ico dark" style="width: 29px; height: 29px;"><span class="mono" style="font-size: calc(18 * 0.72px); line-height: 1;">D</span></div>
      </div>
      <p class="sizes"><span style="width: 88px">180pt</span><span style="width: 60px">120</span><span style="width: 44px">87</span><span style="width: 29px">58</span></p>
    </div>

    <div class="rule"></div>

    <div class="side">
      <div class="stack">
        <p class="row-label">Launch screen</p>
      </div>
      <div class="splash"><span class="mono" style="font-size: calc(64 * 0.72px); line-height: 1;">D</span><span class="word">DYOTA</span></div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
