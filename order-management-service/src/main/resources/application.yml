spring:
  application:
    name: order-management-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:order_management_system}
    username: ${DB_USER:loginsvc}
    password: ${DB_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

oms:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  auth-service:
    base-url: ${AUTH_SERVICE_BASE_URL:http://localhost:8081}
    api-key: ${AUTH_SERVICE_API_KEY:}
    connect-timeout: PT2S
    read-timeout: PT5S
  session:
    # Tokens do not expire on their own; a session ends when the user logs out.
    # Setting a duration here switches on absolute expiry without a migration.
    ttl:
    # A logged-out session row has no further value, so it is swept after this.
    revoked-retention: P30D
    # Bounds table growth without ever expiring a token in normal use: the oldest
    # session beyond this count is revoked when a new one is created.
    max-per-user: 10
    # last_used_at is only rewritten once it is this stale, so a read does not
    # become a write on every single request.
    last-used-precision: PT5M
    cleanup-interval: PT1H

logging:
  level:
    com.dyota.oms: INFO
